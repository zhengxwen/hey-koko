<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Big V4: hero avatar + single speech bubble, white bg -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="85%"><stop offset="0" stop-color="#ffffff"/><stop offset="75%" stop-color="#ffffff"/><stop offset="100%" stop-color="#fbf4ec"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd0a0"/><stop offset="1" stop-color="#ff9a5e"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe2c9"/><stop offset="1" stop-color="#ffc09a"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#90602f"/><stop offset="1" stop-color="#5e3a1f"/></linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb38f"/><stop offset="1" stop-color="#f0865a"/></linearGradient>
    <linearGradient id="msgA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe7d2"/><stop offset="1" stop-color="#ffd6b4"/></linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c2c5ca"/><stop offset="0.5" stop-color="#8c8f95"/><stop offset="1" stop-color="#6b6e73"/></linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26272a"/><stop offset="1" stop-color="#151619"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe3c6"/><stop offset="1" stop-color="#ffc59a"/></linearGradient>
    <linearGradient id="beamWide" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffce9f" stop-opacity="0.55"/><stop offset="55%" stop-color="#ffdab4" stop-opacity="0.28"/><stop offset="100%" stop-color="#ffe6cf" stop-opacity="0.08"/></linearGradient>
    <linearGradient id="beamCore" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff0dc" stop-opacity="0.5"/><stop offset="100%" stop-color="#fff0dc" stop-opacity="0"/></linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#e08a4a" flood-opacity="0.18"/></filter>
    <filter id="beamBlur" x="-25%" y="-25%" width="150%" height="150%"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="round"><rect width="1024" height="1024" rx="220"/></clipPath>
    <clipPath id="av"><circle cx="262" cy="244" r="116"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- MacBook (behind the beam, avatar and text) -->
    <g>
      <!-- aluminum lid -->
      <rect x="230" y="512" width="564" height="300" rx="24" fill="url(#metal)"/>
      <rect x="230" y="512" width="564" height="9" rx="4.5" fill="#dfe1e4" opacity="0.55"/>
      <!-- black screen bezel + glowing display -->
      <rect x="248" y="530" width="528" height="264" rx="16" fill="url(#bezel)"/>
      <rect x="266" y="546" width="492" height="232" rx="9" fill="url(#screen)"/>
      <rect x="266" y="546" width="492" height="48" rx="9" fill="#ffe0bc" opacity="0.9"/>
      <!-- aluminum base / deck -->
      <path d="M 208 812 L 816 812 L 892 916 Q 901 936 879 936 L 145 936 Q 123 936 132 916 Z" fill="url(#metal)"/>
      <rect x="208" y="812" width="608" height="6" fill="#55585d" opacity="0.7"/>
      <rect x="448" y="918" width="128" height="15" rx="7" fill="#55585d"/>
    </g>
    <g filter="url(#beamBlur)" opacity="0.9">
      <path d="M 360 560 L 664 560 L 1024 290 L 1024 56 L 0 56 L 0 290 Z" fill="url(#beamWide)"/>
      <path d="M 420 560 L 604 560 L 700 96 L 324 96 Z" fill="url(#beamCore)"/>
    </g>
    <g transform="translate(-89.8,-172.1) scale(1.9839)">
      <circle cx="262" cy="244" r="124" fill="url(#ring)" filter="url(#drop)"/>
      <circle cx="262" cy="244" r="114" fill="#fff3e6"/>
      <g clip-path="url(#av)">
        <ellipse cx="262" cy="248" rx="94" ry="102" fill="url(#hair)"/>
        <path d="M 178 470 C 178 350 214 300 262 300 C 310 300 346 350 346 470 Z" fill="url(#cloth)"/>
        <ellipse cx="262" cy="246" rx="80" ry="88" fill="url(#face)"/>
        <path d="M 184 256 C 182 190 220 168 262 168 C 304 168 342 190 340 256 C 320 206 296 192 262 204 C 228 192 204 206 184 256 Z" fill="url(#hair)"/>
        <ellipse cx="226" cy="272" rx="13" ry="8" fill="#ff9d7a" opacity="0.4"/><ellipse cx="298" cy="272" rx="13" ry="8" fill="#ff9d7a" opacity="0.4"/>
        <path d="M 222 250 Q 236 236 250 250" fill="none" stroke="#5a3d28" stroke-width="6" stroke-linecap="round"/>
        <path d="M 274 250 Q 288 236 302 250" fill="none" stroke="#5a3d28" stroke-width="6" stroke-linecap="round"/>
        <path d="M 246 276 Q 262 288 278 276" fill="none" stroke="#cf7d5e" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>
    <g filter="url(#drop)"><path d="M 686 258 L 644 290 L 700 280 Z" fill="url(#msgA)"/><rect x="688" y="156" width="306" height="174" rx="68" fill="url(#msgA)"/></g>
    <text x="841" y="240" text-anchor="middle" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="60" font-weight="700" fill="#9a5a30">Hi there!</text>
    <circle cx="797" cy="296" r="12" fill="#cdb393"/><circle cx="841" cy="296" r="12" fill="#bfa078"/><circle cx="885" cy="296" r="12" fill="#cdb393"/>
  </g>
</svg>
